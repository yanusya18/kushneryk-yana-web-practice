<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог робочих місць — Простір</title>
  <meta name="description" content="Усі робочі місця коворкінгу: open space, фіксовані місця, кабінети та переговорні з цінами за годину.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">
  <meta property="og:site_name" content="Простір">
  <meta property="og:title" content="Каталог робочих місць — Простір">
  <meta property="og:description" content="Усі робочі місця коворкінгу: open space, фіксовані місця, кабінети та переговорні з цінами за годину.">
  <meta property="og:image" content="../assets/images/hero-960.jpg">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <script>
    /* Застосовує збережену тему до відмальовування сторінки (без «мигання»). */
    try { var t = localStorage.getItem('coworking:theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">Простір</a>
      <div class="site-header__controls">
        <button class="theme-toggle" type="button" aria-pressed="false">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
          <span class="theme-toggle__label">Темна тема</span>
        </button>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="nav-toggle__icon" aria-hidden="true"></span>
          <span class="nav-toggle__label">Меню</span>
        </button>
      </div>
      <nav id="site-nav" aria-label="Основна навігація">
        <ul class="nav-list">
          <li><a href="index.html">Головна</a></li>
          <li><a href="catalog.html" aria-current="page">Каталог</a></li>
          <li><a href="index.html#pricing">Послуги та ціни</a></li>
          <li><a href="contacts.html">Контакти</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1>Каталог робочих місць</h1>

    <section aria-labelledby="filters-title">
      <h2 id="filters-title">Пошук і фільтри</h2>
      <form class="form form--wide" id="filters-form" action="catalog.html" method="get">
        <fieldset>
          <legend>Параметри пошуку</legend>
          <div class="filters-grid">
            <p>
              <label for="search">Назва місця</label>
              <input type="search" id="search" name="q" maxlength="60" placeholder="Наприклад, біля вікна">
            </p>
            <p>
              <label for="type">Тип місця</label>
              <select id="type" name="type">
                <option value="">Усі типи</option>
                <option value="open-space">Open space</option>
                <option value="fixed-desk">Фіксоване місце</option>
                <option value="private-office">Приватний кабінет</option>
                <option value="meeting-room">Переговорна</option>
              </select>
            </p>
            <p>
              <label for="max-price">Макс. ціна за годину, грн</label>
              <input type="number" id="max-price" name="max_price" min="0" max="1000" step="10" inputmode="numeric">
            </p>
            <p>
              <label for="sort">Сортування</label>
              <select id="sort" name="sort">
                <option value="default">За замовчуванням</option>
                <option value="price-asc">Спочатку дешевші</option>
                <option value="price-desc">Спочатку дорожчі</option>
                <option value="name">За назвою</option>
              </select>
            </p>
          </div>
        </fieldset>
        <div class="filters-actions">
          <button class="button" type="submit">Показати</button>
          <button class="button button--secondary" id="filters-reset" type="button">Скинути</button>
        </div>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Доступні місця</h2>
      <p class="results-count" id="results-count" role="status"></p>
      <div id="catalog-state" class="state" role="status" hidden></div>
      <div class="card-grid" id="workspace-list" aria-live="polite" aria-busy="true"></div>
      <noscript><p>Для перегляду каталогу потрібен увімкнений JavaScript.</p></noscript>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <nav aria-label="Нижня навігація">
        <ul class="nav-list">
          <li><a href="index.html">Головна</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="contacts.html">Контакти</a></li>
        </ul>
      </nav>
      <address>
        <a href="mailto:hello@example.com">hello@example.com</a><br>
        <a href="tel:+380000000000">+380 00 000 00 00</a>
      </address>
      <p><small>© <time datetime="2026">2026</time> Простір. Навчальний проєкт.</small></p>
    </div>
  </footer>
  <script type="module" src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/catalog.js"></script>
</body>
</html>
