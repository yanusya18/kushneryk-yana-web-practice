<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b3a42">
  <title>Немає з’єднання — Простір</title>
  <!-- Сторінка повністю самодостатня (стилі всередині): вона показується, коли мережі немає -->
  <style>
    :root { color-scheme: light dark; --bg: #f6fafc; --text: #12191c; --muted: #4a5a62; --brand: #1f5f6b; --on-brand: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121a1d; --text: #f1f6f8; --muted: #a9bac1; --brand: #6fc1cf; --on-brand: #0c1417; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
           background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.6; }
    main { max-width: 28rem; text-align: center; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.2; margin: 0 0 1rem; }
    p { color: var(--muted); margin: 0 0 1.5rem; }
    button { min-height: 2.75rem; padding: 0.5rem 1.5rem; border: 0; border-radius: 999px; background: var(--brand); color: var(--on-brand);
             font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
  </style>
</head>
<body>
  <main id="main-content">
    <h1>Немає з’єднання з інтернетом</h1>
    <p>Схоже, ви офлайн. Перегляд каталогу й бронювання потребують мережі. Перевірте підключення та спробуйте ще раз.</p>
    <button type="button" onclick="location.reload()">Спробувати ще раз</button>
  </main>
</body>
</html>
