<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Простір — коворкінг із бронюванням робочих місць</title>
    <meta name="description" content="Світлий коворкінг: оберіть робоче місце, перегляньте ціни та забронюйте його на потрібні дату й час онлайн." />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index, follow" />
    <!-- Open Graph за замовчуванням; для кожного маршруту значення оновлює useSeo (src/utils/seo.js) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Простір" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:title" content="Простір — коворкінг із бронюванням робочих місць" />
    <meta property="og:description" content="Світлий коворкінг: оберіть робоче місце та забронюйте його на потрібні дату й час онлайн." />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <!-- PWA (ПР 10): маніфест, колір панелі браузера, іконка для iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2b3a42" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      /* Застосовує збережену тему до відмальовування сторінки (без «мигання»). */
      try { var t = localStorage.getItem('coworking:theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для роботи сайту потрібен увімкнений JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
